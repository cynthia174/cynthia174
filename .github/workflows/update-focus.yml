name: Update current focus

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate focus from recent repositories
        env:
          FOCUS_REPOS_TOKEN: ${{ secrets.FOCUS_REPOS_TOKEN }}
        run: python scripts/update_focus.py

      - name: Commit changes when focus changed
        run: |
          if git diff --quiet -- README.md; then
            echo "Current Focus is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update current focus"
          git push
